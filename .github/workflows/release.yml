name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/steamdeckhomebrew/holo-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-holo
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - name: Test, build and package
        run: sh scripts/ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install: in Decky's settings turn on Developer mode, then use Developer → Install Plugin from ZIP with floater-$GITHUB_REF_NAME.zip."
          flags=(--generate-notes --notes "$notes" --title "Floater $GITHUB_REF_NAME")
          # Versions before 1.0.0 and tags like v1.2.0-beta.1 are pre-releases.
          [[ $GITHUB_REF_NAME == v0.* || $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
