name: Upstream compatibility

# Weekly early warning for Gamescope, MangoHud, SteamOS and Decky library changes.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/steamdeckhomebrew/holo-base:latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-holo
      - name: Check the newest Gamescope and MangoHud
        run: python3 scripts/compat-check.py
      - name: Build against today's SteamOS image
        if: ${{ !cancelled() }}
        run: sh scripts/ci.sh
      - name: Build against the newest Decky libraries
        if: ${{ !cancelled() }}
        run: |
          pnpm update --latest @decky/ui @decky/api @decky/rollup
          pnpm run build

  report:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream compatibility check failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "The weekly check found a newer Gamescope or MangoHud, a missing interface, or a build failure: $RUN_URL"
          fi
