name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    # The Decky Plugin Store builds the helper in this image too.
    container:
      image: ghcr.io/steamdeckhomebrew/holo-base:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm python gcc make pkgconf libpipewire \
            libx11 libxext libxrender libxcomposite libxdamage libxfixes
          npm install -g pnpm@9
      - uses: actions/checkout@v4
      - name: Test, build and package
        run: sh scripts/ci.sh
      - uses: actions/upload-artifact@v3
        with:
          name: floater-${{ github.sha }}
          path: release/
