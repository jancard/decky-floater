name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: docker
    container:
      image: ghcr.io/steamdeckhomebrew/holo-base:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm python gcc make pkgconf libpipewire \
            libx11 libxext libxrender libxcomposite libxdamage libxfixes
          npm install -g pnpm@9
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match $version"; exit 1; }
      - name: Test, build and package
        run: sh scripts/ci.sh
      - name: Create a draft release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: python3 scripts/forgejo-release.py "$GITHUB_REF_NAME" release/floater-*.zip release/floater-*.zip.sha256
